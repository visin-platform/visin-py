[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "visin"
dynamic = ["version"]
description = "Report training runs, epochs, test results, benchmarks and prediction frames to Visin, and read them back."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Toomas Tahves" }]
keywords = ["machine-learning", "experiment-tracking", "computer-vision", "mlops", "visin"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Typing :: Typed",
]
dependencies = ["requests>=2.25"]

[project.optional-dependencies]
# Better host and memory numbers for system_info() and system_metrics().
system = ["psutil>=5.8"]
# Api.epochs_frame().
pandas = ["pandas>=1.3"]
# What the test suite needs; the CI matrix installs only this, down to 3.9.
test = [
  "pytest>=7",
  "pytest-cov>=5",
  "coverage>=7.10",
  "jsonschema>=4.18",
  "pandas>=1.3",
]
# The documentation site: mkdocs build --strict.
docs = [
  "mkdocs>=1.6,<2",  # Material and mkdocstrings do not run on MkDocs 2
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
]
# Everything a contributor runs: tests, lint, types, packaging, docs, hooks.
dev = [
  "visin[test,docs]",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-requests",
  "build>=1.0",
  "twine>=6.1",
  "pre-commit>=3.5",
]

[project.scripts]
visin = "visin.cli:main"

[project.urls]
Homepage = "https://github.com/visin-platform/visin-py"
Source = "https://github.com/visin-platform/visin-py"
Issues = "https://github.com/visin-platform/visin-py/issues"
Changelog = "https://github.com/visin-platform/visin-py/blob/main/CHANGELOG.md"
Documentation = "https://github.com/visin-platform/visin-py#readme"

[tool.hatch.version]
path = "src/visin/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/visin"]

[tool.hatch.build.targets.sdist]
include = [
  "src/visin",
  "tests",
  "docs",
  "scripts",
  "mkdocs.yml",
  "Makefile",
  "README.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "LICENSE",
]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Optional[...] and Union[...] spell the runtime type aliases 3.9 evaluates.
"src/visin/_internal/transport.py" = ["UP006", "UP007", "UP035"]

[tool.mypy]
# mypy no longer checks against 3.9; ruff's target-version and the CI matrix hold the floor.
python_version = "3.10"
files = ["src/visin"]
strict = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["keras.*", "tensorflow.*", "lightning.*", "pytorch_lightning.*", "omegaconf.*", "psutil.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --import-mode=importlib"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["visin"]
branch = true
# Measure the scripts the process tests start, too.
patch = ["subprocess"]
# The framework callbacks import their framework at the top; they are covered
# by tests that stand in fakes, which coverage still counts.
omit = ["src/visin/__main__.py"]

[tool.coverage.report]
# Sits just below current coverage; raise it when you add coverage.
fail_under = 92
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "pragma: no cover"]
