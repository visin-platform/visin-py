# Every check a change must pass. Also called by release.yml, so nothing is
# published that this has not passed, and run weekly so that a change to Visin's
# API that breaks this package is caught even when nothing here changed.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Mondays: the contract check against Visin's main branch
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: make lint
      - run: make typecheck

  test:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The package goes into whatever Python a training image has: the
        # oldest cluster images still ship 3.9, current ones 3.13 or 3.14.
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # Laptops: the same script has to run there with reporting on or off.
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
          cache: pip
      - run: pip install -e '.[test]'
      - run: python -m pytest

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e '.[test]'
      # Fails under the floor in pyproject.toml.
      - run: make coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  contract:
    name: API contract (Visin main)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e '.[test]'
      - name: Fetch the API spec Visin publishes
        run: >
          curl -fsSL -o "$RUNNER_TEMP/vision.json"
          https://raw.githubusercontent.com/visin-platform/visin/main/apps/frontend/landing-front/public/openapi/vision.json
      - name: Fetch the dataset API spec Visin publishes
        run: >
          curl -fsSL -o "$RUNNER_TEMP/dataset.json"
          https://raw.githubusercontent.com/visin-platform/visin/main/apps/frontend/landing-front/public/openapi/dataset.json
      - run: make contract
        env:
          VISIN_OPENAPI: ${{ runner.temp }}/vision.json
          VISIN_DATASET_OPENAPI: ${{ runner.temp }}/dataset.json

  build:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install build twine
      - run: make build
      # What a user gets from pip, installed alone: no source tree, no dev tools.
      - name: Install the wheel into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/clean/bin/visin" version
          "$RUNNER_TEMP/clean/bin/python" -c "import visin; run = visin.init('smoke'); assert run.mode == 'disabled'"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e '.[docs]'
      - run: make docs
